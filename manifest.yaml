design:
  architecture_doc_path: "docs/02-方案设计说明.md"
  key_decisions:
    - decision: "REQ-311一次集成板端显示触摸与IMU/按键后实测"
      alternatives_considered: "A先显示触摸再倾斜；B全部接入后验证"
      rationale: "学生选择B；保留分层日志，编译不冒充物理验收"
      decided_by: "殷白玉明确选择B"
    - decision: "单机原型采用纯C规则核心，独立于LVGL和外设"
      alternatives_considered: "规则嵌入界面回调，或独立规则库并用电脑测试"
      rationale: "后者可复用给联机房主，固定棋盘可自动验证"
      decided_by: "Codex给出备选及规则示例，殷白玉要求按建议先做一版；团队最终规则待评审"
    - decision: "人机对战采用 negamax+alpha-beta，搜索固定 spawn=0，独立 AI 线程"
      alternatives_considered: "MCTS/完整Expectimax/纯规则启发式；搜索读取真实RNG；主线程阻塞搜索"
      rationale: "想法稿要求 Alpha-Beta 剪枝对比；棋盘分支较小、板端可解释；spawn=0 避免偷看下一步随机块；独立线程保证 LVGL 不冻结"
      decided_by: "学生 2026-10-17 明确选择：不建模随机块、独立 AI 线程、模式页两个先后手按钮；原件留在课程目录、仓库只写摘要"
    # 每一条关键决策都要写清楚：决策内容 / 考虑过的备选方案 / 选择理由 / 谁做的最终决定
    - decision: "人机对战入口改为单入口 + 先后手准备页"
      alternatives_considered: "模式页两个“我执红/我执蓝”按钮；固定人类执红；完整联机房间页"
      rationale: "匹配想法稿非联机准备页，先后手关系更直观且可交换；不引入房间/旁观逻辑"
      decided_by: "学生 2026-10-17 明确要求：左红先手默认玩家、右蓝后手默认 AI、点击方框互换、取消/开始"
    - decision: "AI 决策先预览约 500ms 再自动确认"
      alternatives_considered: "AI 直接落子；固定更长/更短停顿；每步等待用户确认"
      rationale: "让学生看清 AI 选择的方向和受影响格子，同时不阻塞 UI；500ms 由学生指定为默认值"
      decided_by: "学生 2026-10-17 明确要求“先显示预览，稍微停顿（如 0.5s）后再真实移动”"
    - decision: "联机只走板载蓝牙，不做 WiFi/互联网匹配；反馈只用板载 RGB"
      alternatives_considered: "外接 WiFi / 手机 App / BLE+BT PAN 互联网联机；外接震动马达"
      rationale: "板载无 WiFi、无马达、无电池；课程板卡稀缺，先保单机/人机/参数闭环；BT PAN 与互联网联机列为拓展，不承诺"
      decided_by: "硬件约束（旧立项材料）；联机范围由蔡融汉负责，尚未进入实现"
    - decision: "联机采用房主权威 + 全量快照 + 客户端只发意图"
      alternatives_considered: "双端锁步 / 房主权威+增量同步 / 客户端权威 / P2P / 经手机中继"
      rationale: "房主是唯一裁判，随机块只由房主生成；客户端不本地提交，状态分叉风险低；6×6 全量快照体积可控，断线后一发快照即可恢复；多房间=多房主，不需要中心服务器"
      decided_by: "蔡融汉 2026-11-08 联机方案明确选择；备选与权衡由 agent 整理"
    - decision: "房主作为 BLE 外设/GATT 服务端，对手与旁观者作为中央设备连接房主"
      alternatives_considered: "所有端都做中央经手机/中继 / 经典蓝牙 SPP / BT PAN 互联网 / 外接 WiFi"
      rationale: "板载无 WiFi；房主广播便于大厅发现，多房间即多台房主；旁观者天然是只读镜像；BT PAN 与互联网列为拓展"
      decided_by: "蔡融汉 2026-11-08 联机方案"
    - decision: "断线采用 1s 心跳 + 10s 判连 + 10s 冻结重连窗口 + token REJOIN + 在场方判缺席方负"
      alternatives_considered: "立即判负 / 无限等待 / 只依赖 BLE 链路监督超时 / 断线后新开一局"
      rationale: "避免 BLE 瞬断误判；token 绑定席位防止随便重连占位；窗口内全量快照恢复；房主单点按 L-07 不做局内迁移"
      decided_by: "蔡融汉 2026-11-08 联机方案"
    - decision: "联机预览只转发给旁观者，对手不可见"
      alternatives_considered: "预览广播给房间内所有人 / 完全不转发远程预览 / 落子后才给对手看"
      rationale: "预览是本地临时状态，广播会让对手偷看操作意图；旁观者可看双方预览；路由规则可做成 net_room 纯逻辑测试"
      decided_by: "蔡融汉 2026-11-08 联机方案"
    - decision: "旁观容量 K 待 P-02 实测后决定；若房主只能 1 条并发连接，首版砍旁观或改中继"
      alternatives_considered: "先承诺旁观 / 直接砍掉旁观 / 经手机中继 / 多房主分区"
      rationale: "BLE 并发连接数未实测，不能先写死 K；容量是旁观功能的生死线，必须在双板+旁观设备上实测"
      decided_by: "蔡融汉 2026-11-08 方案列为待实测；实测后由学生拍板"
    - decision: "历史/计时 v1 采用 RAM 环形缓冲（最近 10 局 + 单局计时），不做 Flash 持久化"
      alternatives_considered: "NOR Flash 持久化 / TF 卡 / 配套端或云端 / RAM-only"
      rationale: "历史不是核心胜负闭环；无 TF 卡座；NOR 与固件共享，需评估擦写寿命/掉电写入；RAM-only 可主机完全测试、无掉电风险；重启清空需明确告知"
      decided_by: "agent 提议，ADR-0010 状态为“提议（待蔡融汉确认）”；学生未最终拍板"
    - decision: "测试自动化按 L0 文档→L1 主机→L2 桌面→L3 编译→L4 板端→L5 长时分梯；CI 只跑 L0/L1/L1b"
      alternatives_considered: "只做人工点测 / 引入新测试框架 / 把桌面 LVGL 也搬进 CI"
      rationale: "复用现有 run_host.py/桌面 LVGL/flash_and_capture.py；桌面 LVGL 需 SDK 3–4 GB + MSVC，不适合 Ubuntu CI；板端必须人工操作；主机覆盖率已达 76.2%–100%"
      decided_by: "蔡融汉 2026-11-08 要求补自动化；agent 设计分层，具体命令见 docs/guides/testing.md"

