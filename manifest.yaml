    description: "人机对战 AI 主机/桌面/编译（软件部分）"
    expected: "AI 合法动作、不偷看 RNG、桌面人机流程、SDK 编译"
    actual: "主机 62 断言 PASS；桌面 TC-315/316/317 PASS；main.bin 839,584 B；真机由学生视频确认"
    pass: true
    evidence_path: "evidence/ai/README.md"
  - test_id: "TC-316-SW"
    description: "AI 决策预览 500ms 与单次提交（软件部分）"
    expected: "先预览、延迟后一次提交、预览中人类输入无效、首页取消不落子"
    actual: "桌面 TC-316 PASS；真机由学生视频确认验证成功"
    pass: true
    evidence_path: "evidence/ai/desktop-test-tc316.log"
  - test_id: "TC-317-SW"
    description: "人机准备页与先后手互换（软件部分）"
    expected: "默认红先玩家、右蓝后 AI、点击互换、取消/开始、AI 执红先手"
    actual: "桌面 TC-317 PASS；真机由学生视频确认验证成功"
    pass: true
    evidence_path: "evidence/ai/desktop-test-tc317.log"
  - test_id: "TC-304-05"
    description: "前到后移动顺序、可行动数量和数字补位板端验证"
    expected: "N2 B8 N2 . B8 . 向右选2兵 -> . N2 B6 . N2 B6"
