# ============================================================
# 交接清单 Manifest 模板
# 黄山派嵌入式产品开发实验课程 · Agent协作开发与评审机制
#
# 用途：Dev Agent（学生侧）按此schema生成提交材料，
#       Eval Agent（教师侧）按此schema解析并评审。
# 使用方法：复制本文件为 submission_<学号或组号>_<里程碑>.yaml，
#          按字段填写；带 <> 的地方替换成实际内容。
# 重要：本文件中除 dev_agent.model / dev_agent.tool 等元信息栏位外，
#      其余内容应尽量由agent在开发过程中自动生成/追加，
#      而不是学生在提交前手写编造——手写内容的可信度视同人工记录，
#      不享有"agent执行留痕"的免核验优先级。
# ============================================================

submission:
  student_id: "<学号，例如 S2026001>"
  student_name: "<姓名>"
  group_id: "<组别，例如 G3>"
  milestone: "<里程碑名称，例如 阶段4-AI语音集成 / Capstone-检查点2 / Capstone-终版>"
  submitted_at: "<ISO时间戳，例如 2026-11-03T21:40:00+08:00>"

dev_agent:
  tool: "Codex"
  model: "GPT-6"
  session_log_path: "<完整会话记录文件路径，必须是原始导出，不可编辑>"
  session_log_hash: "<可选：会话记录文件的哈希值，用于防止事后篡改>"

requirements:
  prd_path: "docs/01-需求规格说明.md"
  hardware_constraints_ref: "<引用的硬件规格文档，例如黄山派硬件手册链接或本地副本路径>"

design:
  architecture_doc_path: "docs/02-方案设计说明.md"
  key_decisions:
    - decision: "REQ-311一次集成板端显示触摸与IMU/按键后实测"
      alternatives_considered: "A先显示触摸再倾斜；B全部接入后验证"
      rationale: "学生选择B；保留分层日志，编译不冒充物理验收"
      decided_by: "殷白玉明确选择B"
    - decision: "单机原型采用纯C规则核心，独立于LVGL和外设"
      alternatives_considered: "规则嵌入界面回调，或独立规则库并用电脑测试"
      rationale: "后者可复用给联机房主，固定棋盘可自动验证"
      decided_by: "Codex给出备选及规则示例，殷白玉要求按建议先做一版；团队最终规则待评审"
    - decision: "人机对战采用 negamax+alpha-beta，搜索固定 spawn=0，独立 AI 线程"
      alternatives_considered: "MCTS/完整Expectimax/纯规则启发式；搜索读取真实RNG；主线程阻塞搜索"
      rationale: "想法稿要求 Alpha-Beta 剪枝对比；棋盘分支较小、板端可解释；spawn=0 避免偷看下一步随机块；独立线程保证 LVGL 不冻结"
      decided_by: "学生 2026-10-17 明确选择：不建模随机块、独立 AI 线程、模式页两个先后手按钮；原件留在课程目录、仓库只写摘要"
    # 每一条关键决策都要写清楚：决策内容 / 考虑过的备选方案 / 选择理由 / 谁做的最终决定
    - decision: "<例如：选择BLE而非WiFi做数据同步>"
      alternatives_considered: "<例如：曾考虑过用SD卡离线导出，因为使用场景需要实时同步而放弃>"
      rationale: "<为什么最终这么选，写具体理由，不要只写'效果更好'>"
      decided_by: "<agent建议+学生确认 / 学生主导 / 纯agent自动决定（不建议用于关键决策）>"

code:
  repo_url: "https://github.com/Soviet-i/geyi"
  commit_range: "<起始commit..结束commit，对应本次里程碑>"

physical_verification:
  - item: "REQ-314 RGB灯反馈"
    required_action: "观察有效行动短闪及终局闪灯，核对颜色、亮度与次数"
    executed_at: "2026-10-15（本人确认日期；精确测试时刻未单列）"
    evidence_path: "evidence/board/20261015_213937/serial.log；docs/04-测试报告.md本人审核确认补充"
    agent_conclusion: "串口有light自检及灯事件，殷白玉审核提交说明时明确确认实物颜色/亮度/次数；无仪器测量数据，不写为AI独立实测。"
  - item: "REQ-311/REQ-312板端启动、简体显示与倾斜预览留证"
    required_action: "本人烧录，观察简体显示与操作，回传真实日志、照片和反馈"
    executed_at: "2026-10-15（精确操作时刻未单独确认；采集目录205419、回传文件2106）"
    evidence_path: "evidence/board/20261015_2106/README.md"
    agent_conclusion: "照片可见简体UI；串口含启动、校准与四向预览，源码哈希一致。本人审核提交时明确确认完整对局、金币放兵及长期稳定性验收完成、代码人工核验后无修正；未提供量化时长/局数，不记为AI独立测量。"
  # 每一个物理验证节点都要有对应记录，节点类型见配套文档《Agent协作开发与评审机制》第三节表格
  - item: "<验证项名称，例如：固件烧录与串口启动log>"
    required_action: "<agent当时要求学生具体做什么>"
    executed_at: "<学生实际执行的时间戳>"
    evidence_path: "<原始证据文件路径：照片/视频/日志/示波器截图>"
    agent_conclusion: "<agent基于该证据得出的结论，例如：启动正常，IMU初始化成功>"

test_results:
  - test_id: "<测试编号，例如 TC-01>"
    description: "<测试内容简述>"
    expected: "<预期结果>"
    actual: "<实测结果>"
    pass: <true 或 false>
    evidence_path: "<对应的原始数据/截图路径>"

known_issues:
  - "REQ-315 AI 核心、独立线程封装、模式页入口、主机/桌面测试和 SDK 编译已完成（main.bin 838544 B，含 REQ-316 预览）；尚未烧录，AI 真机行为、屏幕文字、线程耗时/栈高水位均未验证。"
  - "REQ-316 AI 决策预览已实现并在桌面测试通过（默认 500ms、移动/放兵预览、预览中人类输入无效、首页/重开取消）；真机预览时长、只落子一次和真实屏幕观感待学生烧录取证。"
  - "AI 搜索按学生选择固定 spawn=0，不建模每步随机生成的 2/4 数字块；这是已知近似，可能低估数字块威胁。"
  - "AI 评估权重是 v0 初始值，只通过固定局面和 30 手自对弈路径测试，尚未做棋力/平衡性调参；不得宣称 AI 已平衡或足够聪明。"
  - "人机对战默认最多 5 层、300ms、节点上限 200000；开发板上的实际耗时、线程栈和内存尚未测量，需学生烧录取证。"
  - "自定义游戏参数中的 AI 搜索深度本轮不实现，首页对应入口继续保持禁用。"
  - "当前规则仍为个人原型暂定规则，AI 按当前核心规则实现，不擅自修改放兵生成/参数化规则；需团队/组长确认。"
  - "最新审核反馈：殷白玉已确认实际灯色、亮度及闪灯次数，记录为本人实测确认，无仪器亮度/计时数据；下列待确认描述为此前状态。本轮更新PR #3，不合并。"
  - "213937板端采集与当前灯效源码哈希一致，light自检及清灯/行动/红胜事件已记录，但无实物灯色/亮度/次数确认。已有团队PR #3，待本轮提交审核后更新，不重复创建。"
  - "REQ-314先做板载RGB，无音效；调度/事件测试及SDK编译通过，物理灯色亮度和时序待烧录验证；evidence/feedback/。"
  - "REQ-313首页与模式页已实现：仅单机可用，参数/历史/人机/联机只展示禁用；导航和软件回归通过，板端新入口未烧录验收，evidence/homepage/。"
  - "当前快照：简体实物照片和日志已留证，本人另确认完整对局/金币放兵/长期稳定性验收完成，未提供时长/局数；下列尚未烧录等为历史状态。规则待组长确认，音效/蓝牙/人机未实现。"
  - "REQ-312简体文本与66字小字库已通过软件检查、LVGL渲染和SDK编译；新固件待学生重烧并拍照，证据evidence/simplified/。"
  - "旧固件board/20261015_203552原始日志含LCD READY与IMU校准；四向、按键和真实UI验收不能仅由日志代替。下列未烧录说明属于此前准备状态。"
  - "REQ-311已按学生B选择接板端LVGL与IMU/按键并完成构建准备，尚未烧录；四向映射、真实触摸和按键均待学生留证。"
  - "REQ-310图形版已完成真实LVGL电脑测试和软件渲染检查，板端LVGL未启用；evidence/graphical/，不得视作真机验收。用户要求不提交上传。"
  - "REQ-309输入层软件模拟60断言及SDK编译通过，但未读取IMU或烧录，参数待真机校准；evidence/single/input_host_test.log。"
  - "2026-10-15新增单机个人原型；主机规则与CLI通过，SDK构建通过，但未烧录，不代表板端游戏完成。"
  - "预览显示未来随机数字仅供调试；正式交互和联机应隐藏，客户端不得提交候选状态。"
  - "暂定规则、学生试玩及代码理解待确认；此前初始化缺少工具链描述属于历史状态，本轮构建证据见evidence/single/firmware_build.log。"
  - "当前仅完成 M0 初始化准备，产品需求、成员分工与提交材料信息尚待学生确认。"
  - "当前终端未设置 SIFLI_SDK，未找到 scons 和 arm-none-eabi-gcc，尚未验证固件编译能力。"
  - "未进行物理验证，physical_verification 与产品测试字段仍保留占位，不能用于里程碑正式提交。"
  - "原始目录缺少 training/T0、T1 任务正文，需向教师索取。"

self_review: |
  <agent生成的自我复盘，包括：本次里程碑完成度如何、哪些地方agent自己也不确定、
  哪些决策是在学生介入/纠正之后才修改的。建议由agent在里程碑结束时自动生成，
  不建议学生代写。>

human_checkpoints:
  # 用于区分"学生自己做的决定"和"agent建议、学生只是同意"
  - decision_point: "<例如：是否采用非线性PWM映射>"
    student_confirmation: "<学生对该决策的确认说明，最好包含'为什么认可/为什么修改'的具体理由>"

