  gy_nav 纯逻辑仲裁，gy_ui 与 gy_board 接线。tests/test_tilt_ux.c 264 断言、桌面
  nav_source_tests、run_host 全量 24572/61/271/2517/85/62/10 PASS、联机 380+281 PASS；
  固件 1,085,716 B + LCPU 6,384 B 编译通过。本机无 VS2022 MSVC，桌面用例改用 MinGW gcc
  构建 SDK LVGL v9 后运行；tools/build_desktop.py 已加入 gcc/clang 回退并包含 geyi_nav.c。
  独立 review 在主机/桌面通过后仍发现 6 个代码级问题（放兵列无全边界半列回差、locked 在板端
  为死代码、联机认输清 nav 不清 ready、4°~6° 带内可改向、无兵方向粘滞、同帧 UPDATE+CONFIRM），
  已逐条修正并补断言（239→271）；板端行为明确为换回合 reset 后若仍倾斜会重新预览。
  未完成：真实倾斜手感/正确率、放兵左右选列、倾斜预览时屏幕取消/增减、屏幕确认单次提交、
  已倾斜开局都未上板；不得写成板端通过。docs/07 §10 记录复现与复测数字，docs/06 L-03
  改为“软件已重构，板端待验证”。

  2026-11-09 板端 COM7 实测（sftool 直接烧录，不依赖 VS Code/MCP）：学生反馈倾斜完全无反应，
  串口显示旧开机采样 zero_x=17873，motion x 在 ±17900 被板端 |x|>9000 丢弃，0 条 tilt。
  尝试只把零点设 0 后 x 仍约 ±178°，确认这块板 Z 轴朝下、atan2(ax,az) 平放即 180°；
  改为 x=atan2(ax,-az) 后平放 x≈0、tilt 出现，但学生指出左右反，再把 X 轴取正。
  最终 90 秒日志 91 motion、26 tilt（21 SELECT+5 UPDATE，0 CANCEL）、7 次 KEY2，换回合后
  仍倾斜自动重预览；证据 evidence/board/20261109_233306/。COM5 2026-11-10 补测放兵
  进入/确认，并由学生目测通过左右/放兵列/屏幕取消增减/确认单次；正确率/延迟未量化。学生明确要求不要开机采样零点，
  本实现按“平放=重力”固定，不再受开机姿态影响。

human_checkpoints:
  # 用于区分"学生自己做的决定"和"agent建议、学生只是同意"
  - decision_point: "AI 算法与随机块处理"
    student_confirmation: "学生选择 Minimax+Alpha-Beta；搜索不建模随机生成块，避免偷看 RNG；开发板使用独立 AI 线程。"
  - decision_point: "AI 决策预览时长与行为"
    student_confirmation: "学生要求 AI 决策后先显示与倾斜相同的预览，约 0.5 秒后再自动确认，预览期间人类操作无效。"
  - decision_point: "人机对战先后手入口"
    student_confirmation: "学生要求改为首页→开始游戏→人机对战→准备页；左红先手默认玩家，右蓝后手默认 AI，点击方框互换，取消返回，开始后按选择进入游戏。"
  - decision_point: "产品名、里程碑与范围"
    student_confirmation: "产品名确定为格弈；当前集成工作不作为新里程碑申报；赵志浩的历史/计时模块仍在开发、尚未提交，不由 agent 代管；旧立项材料只保留硬件约束与风险，产品范围按新想法更新。"
  - decision_point: "参数页最终中文界面与交互"
    student_confirmation: "学生要求参数名中文化，并把 AI 搜索层数放在第 2 页末行；板端测试发现 SPAWN 只能加不能减，修复后回传最终中文第 1 页照片并确认减一可用、末行布局正常。"
  - decision_point: "当前阶段定位"
    student_confirmation: "当前属于测试与联调，不申报新里程碑；联调完成后再开始联机部分。"
  - decision_point: "AI 搜索深度上限"
    student_confirmation: "学生明确要求把 AI 深度设为 6；默认参数仍为 3，界面可调。"
  - decision_point: "人机视频证据的使用边界"
    student_confirmation: "学生提供网盘视频（人机.zip），说明覆盖选择先后手+人机对战；按学生本人确认记录，agent 未解码，不写成 agent 目测；REQ-316 细节与串口为可补证材料，AI 耗时/栈、倾斜量化和帧率为扩展项。"
  - decision_point: "联机拓扑与权威模型"
    student_confirmation: "学生 2026-11-08 明确选择：房主同时充当 BLE 外设、GATT 服务端与唯一裁判；对手/旁观者为中央设备；客户端只发意图；房主每个合法动作广播带单调 seq 的全量快照；不做增量同步。"
  - decision_point: "联机断线与重连"
    student_confirmation: "学生明确要求：1s 心跳、10s 判连、10s 冻结重连窗口；客方用 token REJOIN + 最后 seq 恢复；房主掉线客方重试 10s 后判负；旁观者掉线不冻结；主动退出二次确认后立即判负；结算保留约 10s。"
  - decision_point: "联机预览可见性"
    student_confirmation: "学生明确要求：预览只发房主，房主只转发给旁观者；对手看不到、不回传；客户端只接受自己的预览；旁观者用双方颜色叠加；确认/回中/取消发 PREVIEW_CLEAR。"
  - decision_point: "联机旁观容量与降级"
    student_confirmation: "学生 2026-11-08 方案将 K 定义为房主可接受连接数−1，并要求先实测 P-02；若只能 1 条连接，首版砍旁观或改中继。具体 K 与降级方案待实测后由学生拍板。"
  - decision_point: "文档补全范围与验收矩阵"
    student_confirmation: "学生 2026-11-08 要求补用户需求、用户交互、功能/非功能、自动化测试与专业图表，并让独立上下文 review agent 审查；agent 按此执行，未改产品范围。"
  - decision_point: "历史/计时是否持久化"
    student_confirmation: "学生 2026-11-12 已确认改用 NOR + FlashDB KV（ADR-0013），重启保留最近 10 局；2026-11-13 真机确认。"
  - decision_point: "联机范围与双板止损"
    student_confirmation: "学生 2026-11-08 要求先写测试再实现；agent 已实现主机纯逻辑、BLE 传输与 UI（253 + app 70 checks PASS、固件 1,056,484 B + LCPU 6,384 B），并完成双板 BLE 自动冒烟；后续 UI/旁观/重连已由双板/三端套件与学生真机确认；容量 P-02 为扩展项。"
  - decision_point: "联机主机实现边界"
    student_confirmation: "学生要求“写相关测试，写完测试后规划具体实现方案并实现”；agent 按纯逻辑优先实现 net_proto/net_room/net_link 内存管道，未擅自改 proj.conf 或伪造 BLE/双板结果。是否继续 BLE 绑定与 UI 由学生决定。"
  - decision_point: "IMU 平放零点"
    student_confirmation: "学生 2026-11-09 明确要求：不要用开机采样校准零点，平放就是零点；每次重新校正可能把用户开机时的倾斜当成 0。agent 改为固定重力方向（这块板 Z 轴朝下，x=atan2(ax,-az)），并按真机把 X 轴左右翻正。"
  - decision_point: "倾斜手感与输入仲裁方案"
    student_confirmation: "学生 2026-11-09 明确要求：从 1 兵到 2 兵不得回弹成 0 个兵；缩小预览进入下限；数量默认每 10° 一档，N 档放不下再按兵均分；放兵放在离倾斜方向最近的格子；本回合开始前板子已倾斜也要进入预览；倾斜预览中屏幕取消/增减失效但确认可用，按钮预览时忽略倾斜。agent 按此实现 6°/4° 回滞、10° 档位、200ms 稳定 UPDATE、最近空列与 gy_nav 仲裁；阈值与档位属于学生拍板的暂定手感参数。"

