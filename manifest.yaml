self_review: |
  2026-10-28 本轮把 PR #6（人机对战）、PR #7（移动顺序修正，含 10-18 日志）
  和 PR #4（参数配置）合入本地集成分支 integration/local-merge，解决 6 个文档/工具冲突，
  修复 gy_simulate_move 未遵守 spawn_interval 的集成语义问题，并新增 14 条回归。
  主机测试 26920/60/2517/85/62 全部 PASS（参数页状态 85 断言，含 SPAWN 减一）。
  参数页版本已用 SDK v2.5.1 完成桌面 LVGL 测试、固件编译/烧录与启动自检；SPAWN 减一、中文名与第 2 页末行已修复。平衡扫描主机工具完成，20×50/500 可复现；最终中文界面与参数生效待学生目测。
  参数页软件实现：新增 geyi_param_ui 状态机（模式/分页/条目/增减/重置）、首页入口、
  参数页界面、棋盘 4~8 动态布局、单机/人机开局应用参数、AI 读取人机搜索深度、
  板端输入读取两项缓冲阈值；AI 上限按 REQ-405 从 5 层改为 6 层，默认参数仍为 3 层。
  随后按 10-17 学生视频（选择先后手+人机对战）和 10-18 移动顺序照片统一
  docs/00/01/03/04、evidence 与 manifest 的状态口径：视频只确认学生看到的流程，
  agent 未解码，不写成 agent 实测；REQ-316 的 500ms/单次提交/取消、串口 ai=PASS、
  AI 耗时/栈、倾斜量化、帧率仍缺。产品名统一为格弈；硬件约束与旧立项风险已整理。
  不确定/未完成：集成分支未 push；参数页桌面/板端未验收；平衡扫描、历史/计时、联机/BLE 未完成；
  training T0/T1 正文缺失；TC-303-05 单兵板端仍缺；参数页板端证据仍缺。关键决策由学生拍板；
  学生本次纠正了产品名、里程碑表述和赵志浩状态；agent 自测发现终局分数取负错误并修正。

