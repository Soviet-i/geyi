    required_action: "烧录 839,552 B 固件，摆出 N2 B8 N2 . B8 .，向右选 2 兵，观察预览和落子"
    executed_at: "2026-10-18（学生拍照时间；精确时刻未单列）"
    evidence_path: "evidence/move-order/README.md"
    agent_conclusion: "学生提供 hardware-01/02/03.jpg：移动前 2 B8 2 . B8 .，预览 . 2 B6 . 2 B6（数量2个），确认后位置一致并换手；支持 TC-304-05 的两兵移动、数字补位和 D1 B6 伤害。未提供 TC-303-05 单兵照片、串口日志或仪器计时，agent 未独立测量。"

