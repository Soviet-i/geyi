self_review: |
  本次完成 REQ-315~317 的文档、规则核心模拟接口、negamax+Alpha-Beta AI、
  独立 AI 线程封装、人机 UI、500ms 决策预览和先后手准备页。主机 62 条 AI 断言、
  桌面 TC-315/316/317 和 SDK 编译均通过，最新固件 839,584 B。
  不确定/未完成：板端物理验证由学生本人完成并确认；证据为百度网盘视频链接，
  agent 当前环境无法访问 pan.baidu.com，未独立打开/解码视频，因此没有把真机项
  写成 agent 目测或仪器测量。AI 评估权重未调参，线程耗时/栈高水位未测，
  自定义搜索深度未实现。关键决策由学生拍板；agent 自测发现终局分数取负错误并
  修正；学生尚未逐行审阅代码。

