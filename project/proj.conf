CONFIG_BSP_PWMT2_UPDATE_USING_DMA=y
CONFIG_RGB_SK6812MINI_HS_ENABLE=y
CONFIG_RGB_USING_SK6812MINI_HS_PWM_DEV_NAME="pwmt2"
CONFIG_BSP_USING_RGBLED_CH=1
CONFIG_RT_MAIN_THREAD_STACK_SIZE=8192
CONFIG_RT_USING_MEMHEAP=y
CONFIG_PKG_USING_LITTLEVGL2RTT=y
CONFIG_LVGL_V9=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_SOURCE_HAN_SANS_SC_16_CJK=y
CONFIG_LV_FB_TWO_NOT_SCREEN_SIZE=y
CONFIG_BSP_USING_I2C3=y
CONFIG_BSP_USING_PINMUX=y
CONFIG_BSP_USING_GPIO=y
# CONFIG_BSP_USING_PM is not set
# --- 联机 BLE（REQ-501/508/512）---
# 依据 SDK v2.5.1 example/ble/peripheral 与 central_and_peripheral 的 proj.conf/README：
# CONFIG_BLUETOOTH 使能蓝牙协议栈；GAP central/GATT client/连接管理器默认 y，显式写出便于审查；
# 先与 SDK BLE 例程保持一致：ACL=2。4 连接是否可用属 P-02，实测前不要
# 把未经证实的容量写进默认配置。
CONFIG_BLUETOOTH=y
CONFIG_BT_CON_NUM_CUSTOMIZE=y
CONFIG_CFG_MAX_BT_ACL_NUM=2
CONFIG_BLE_GAP_CENTRAL=y
CONFIG_BLE_GATT_CLIENT=y
CONFIG_BSP_BLE_CONNECTION_MANAGER=y
CONFIG_BSP_BLE_NVDS_SYNC=y
CONFIG_PKG_USING_FLASHDB=y
